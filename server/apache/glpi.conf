# Sitio del puerto 80: sirve GLPI y redirige todo a HTTPS.
# El bloque de redirección lo agrega certbot; el segundo "RewriteEngine On"
# (fuera de <Directory>) es necesario para que esas reglas funcionen.
<VirtualHost *:80>
    ServerName soporte.example.com
    ServerAlias www.soporte.example.com
    DocumentRoot /var/www/glpi/public
    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule (.*) index.php [QSA,L]
    </Directory>
RewriteEngine On
RewriteCond %{SERVER_NAME} =www.soporte.example.com [OR]
RewriteCond %{SERVER_NAME} =soporte.example.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
