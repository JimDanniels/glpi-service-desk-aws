# Ícono y título de la pestaña del navegador sin tocar los archivos de GLPI.
# Ubicación: /etc/apache2/conf-available/personalizacion-marca.conf
# Activar:   sudo a2enmod substitute && sudo a2enconf personalizacion-marca
#            sudo apache2ctl configtest && sudo systemctl reload apache2

# Cuando el navegador pide el ícono de GLPI, Apache entrega el de la empresa
Alias /pics/favicon.ico /var/www/marca-assets/favicon.png
<Directory /var/www/marca-assets>
    Require all granted
    ForceType image/png
</Directory>

# Reemplaza el <title> de cada página y fuerza al navegador a recargar el ícono
<Location />
    AddOutputFilterByType SUBSTITUTE text/html
    Substitute "s/<title>[^<]*</<title>Empresa | Soporte Técnico</"
    Substitute "s|/pics/favicon.ico|/pics/favicon.ico?v=marca|"
</Location>
